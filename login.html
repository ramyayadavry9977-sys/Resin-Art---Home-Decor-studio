<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Resin Art & Home Decor</title>
    <link rel="icon" type="image/png" href="images/logo-2.png">

    <!-- Login page stylesheet -->
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main class="login-page">

        <!-- =========================
             TOP RIGHT CONTROLS
        ========================== -->
        <div class="page-controls">

            <!-- RTL -->
            <button
                type="button"
                class="control-button"
                id="rtlButton"
                aria-label="Switch text direction"
                title="RTL Mode"
            >
                ⇄
            </button>

            <!-- Dark Mode -->
            <button
                type="button"
                class="control-button"
                id="themeButton"
                aria-label="Switch dark mode"
                title="Dark Mode"
            >
                <span id="themeIcon">☾</span>
            </button>

        </div>


        <div class="login-card">

    <!-- Logo + Brand Name -->
    <div class="login-brand">

    <a href="index.html" class="login-logo-link">
        <img src="images/logo-2.png" alt="ResinBlossom Studio Logo">
    </a>

    <h2>ResinBlossom Studio</h2>

</div>

    <!-- Login Heading -->
    <div class="login-heading">
        <h1>Welcome Back</h1>
        <p>Sign in to your account</p>
    </div>

    <form>

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >

        <label for="password">Password</label>

        <div class="password-box">
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >
            <i class="fa-regular fa-eye"></i>
        </div>

        <div class="login-options">
            <label>
                <input type="checkbox">
                <span>Remember Me</span>
            </label>

            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

        <div class="divider">
            <span>OR</span>
        </div>

        <button type="button" class="social-btn">
            <i class="fa-brands fa-google"></i>
            Continue with Google
        </button>

        <button type="button" class="social-btn">
            <i class="fa-brands fa-apple"></i>
            Continue with Apple
        </button>

        <p class="signup-text">
            Don't have an account?
            <a href="#">Sign Up</a>
        </p>

    </form>

</div>

    </main>

<script>
    /* ==========================================
   LOGIN PAGE JAVASCRIPT
   ResinBlossom Studio
========================================== */

document.addEventListener("DOMContentLoaded", function () {

    /* ==========================================
       ELEMENTS
    ========================================== */

    const themeButton = document.getElementById("themeButton");
    const themeIcon = document.getElementById("themeIcon");

    const rtlButton = document.getElementById("rtlButton");

    const loginForm = document.querySelector(".login-card form");

    const passwordInput = document.getElementById("password");
    const passwordEye = document.querySelector(".password-box i");

    const emailInput = document.getElementById("email");

    const socialButtons =
        document.querySelectorAll(".social-btn");


    /* ==========================================
       DARK MODE
    ========================================== */

    function applyTheme(theme) {

        if (theme === "dark") {
            document.body.classList.add("dark-mode");

            if (themeIcon) {
                themeIcon.textContent = "☀";
            }

            if (themeButton) {
                themeButton.setAttribute(
                    "title",
                    "Light Mode"
                );
            }

        } else {
            document.body.classList.remove("dark-mode");

            if (themeIcon) {
                themeIcon.textContent = "☾";
            }

            if (themeButton) {
                themeButton.setAttribute(
                    "title",
                    "Dark Mode"
                );
            }
        }
    }


    function toggleTheme() {

        const isDark =
            document.body.classList.contains("dark-mode");

        const newTheme = isDark ? "light" : "dark";

        applyTheme(newTheme);

        localStorage.setItem(
            "loginTheme",
            newTheme
        );
    }


    /* Load saved theme */

    const savedTheme =
        localStorage.getItem("loginTheme") || "light";

    applyTheme(savedTheme);


    /* Theme button */

    if (themeButton) {

        themeButton.addEventListener(
            "click",
            toggleTheme
        );

    }


    /* ==========================================
       RTL / LTR
    ========================================== */

    function applyDirection(direction) {

        document.documentElement.setAttribute(
            "dir",
            direction
        );

        if (direction === "rtl") {

            document.body.classList.add(
                "rtl-mode"
            );

            if (rtlButton) {
                rtlButton.setAttribute(
                    "title",
                    "Switch to LTR"
                );
            }

        } else {

            document.body.classList.remove(
                "rtl-mode"
            );

            if (rtlButton) {
                rtlButton.setAttribute(
                    "title",
                    "Switch to RTL"
                );
            }
        }

        localStorage.setItem(
            "loginDirection",
            direction
        );
    }


    /* Load saved direction */

    const savedDirection =
        localStorage.getItem(
            "loginDirection"
        ) || "ltr";

    applyDirection(savedDirection);


    /* RTL button */

    if (rtlButton) {

        rtlButton.addEventListener(
            "click",
            function () {

                const currentDirection =
                    document.documentElement.getAttribute(
                        "dir"
                    ) || "ltr";

                const newDirection =
                    currentDirection === "rtl"
                        ? "ltr"
                        : "rtl";

                applyDirection(
                    newDirection
                );

            }
        );

    }


    /* ==========================================
       SHOW / HIDE PASSWORD
    ========================================== */

    if (passwordEye && passwordInput) {

        passwordEye.addEventListener(
            "click",
            function () {

                if (
                    passwordInput.type === "password"
                ) {

                    passwordInput.type = "text";

                    passwordEye.classList.remove(
                        "fa-eye"
                    );

                    passwordEye.classList.add(
                        "fa-eye-slash"
                    );

                } else {

                    passwordInput.type = "password";

                    passwordEye.classList.remove(
                        "fa-eye-slash"
                    );

                    passwordEye.classList.add(
                        "fa-eye"
                    );

                }

            }
        );

    }


    /* ==========================================
       LOGIN FORM
    ========================================== */

    if (loginForm) {

        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                const email =
                    emailInput
                        ? emailInput.value.trim()
                        : "";

                const password =
                    passwordInput
                        ? passwordInput.value.trim()
                        : "";


                /* Check email */

                if (email === "") {

                    alert(
                        "Please enter your email address."
                    );

                    if (emailInput) {
                        emailInput.focus();
                    }

                    return;
                }


                /* Check password */

                if (password === "") {

                    alert(
                        "Please enter your password."
                    );

                    if (passwordInput) {
                        passwordInput.focus();
                    }

                    return;
                }


                /* Basic email validation */

                const emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!emailPattern.test(email)) {

                    alert(
                        "Please enter a valid email address."
                    );

                    emailInput.focus();

                    return;
                }


                /*
                   LOGIN SUCCESS

                   Change dashboard.html to the
                   actual page you want to open.
                */

                window.location.href =
                    "dashboard.html";

            }
        );

    }


    /* ==========================================
       SOCIAL BUTTONS
    ========================================== */

    socialButtons.forEach(
        function (button) {

            button.addEventListener(
                "click",
                function () {

                    const buttonText =
                        button.textContent
                            .trim();

                    alert(
                        buttonText +
                        " is not connected yet."
                    );

                }
            );

        }
    );


    /* ==========================================
       FORGOT PASSWORD
    ========================================== */

    const forgotPassword =
        document.querySelector(
            ".login-options a"
        );

    if (forgotPassword) {

        forgotPassword.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                alert(
                    "Password reset functionality will be added soon."
                );

            }
        );

    }


    /* ==========================================
       SIGN UP
    ========================================== */

    const signupLink =
        document.querySelector(
            ".signup-text a"
        );

    if (signupLink) {

        signupLink.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                /*
                   Change this to your signup page
                   when you create it.
                */

                window.location.href =
                    "signup.html";

            }
        );

    }

});
</script>
</body>
</html>
